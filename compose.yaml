services:
  backend: 
    build:
      context: .
    ports:
    - "5000:8080" 
    environment:
    - ConnectionStrings__MySql=Server=mysql;Port=3306;Database=ringshop;User=root;Password=${MYSQL_ROOT_PASSWORD}
    - ConnectionStrings__Redis=redis:6379
    - Cloudinary__CloudName=${CLOUDINARY_NAME}
    - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
    - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis: 
        condition: service_healthy
    restart: unless-stopped

  mysql: 
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=ringshop
    volumes: 
    - mysql_data:/var/lib/mysql  
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      interval: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  redis: 
    image: redis:alpine
    ports: 
    - "6379:6379"
    volumes:
    - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
